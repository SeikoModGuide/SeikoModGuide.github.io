<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Guide Seiko Mod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --ink:#0E0E0F;
    --paper:#FAF8F4;
    --paper-dim:#F1EEE7;
    --line:#D8D4C8;
    --line-soft:#E7E4DA;
    --grey:#6E6C64;
    --grey-light:#A8A499;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Jost', 'Helvetica Neue', Arial, sans-serif;
    --mono:'Space Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 40px;}

  header{border-bottom:1px solid var(--line);}
  .header-inner{
    display:flex;align-items:center;justify-content:space-between;height:84px;
  }
  .brand{
    font-family:var(--serif);font-size:26px;font-weight:600;
    letter-spacing:0.06em;text-transform:uppercase;
  }
  .back-link{
    font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--grey);display:flex;align-items:center;gap:8px;
  }
  .back-link:hover{color:var(--ink);}

  main{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:70px 24px;
  }
  .login-card{
    width:100%;max-width:400px;
    border:1px solid var(--line);padding:48px 40px;
    background:var(--paper);
  }
  .login-eyebrow{
    font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--grey);
    text-align:center;
  }
  .login-card h1{
    font-family:var(--serif);font-weight:500;font-style:italic;
    font-size:32px;text-align:center;margin-top:10px;margin-bottom:38px;
  }
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .field label{
    font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey);
  }
  .field input{
    font-family:var(--sans);font-size:15px;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:10px 0;outline:none;transition:border-color .3s ease;
  }
  .field input::placeholder{color:var(--grey-light);}
  .field input:focus{border-color:var(--ink);}
  .login-submit{
    width:100%;margin-top:10px;
    padding:16px;background:var(--ink);color:var(--paper);
    border:1px solid var(--ink);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;
    cursor:pointer;transition:background .3s ease,color .3s ease;
  }
  .login-submit:hover{background:transparent;color:var(--ink);}
  .login-note{
    display:none;margin-top:16px;font-family:var(--mono);font-size:12px;
    color:var(--grey);text-align:center;
  }
  .login-note.error{color:#B23B3B;}
  .login-note.success{color:#3B7A4A;}
  .mode-toggle{
    display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--grey);
    cursor:pointer;border-bottom:1px solid var(--line-soft);width:max-content;margin-left:auto;margin-right:auto;
  }
  .mode-toggle:hover{color:var(--ink);border-bottom-color:var(--ink);}
  .login-submit[disabled]{opacity:0.5;cursor:not-allowed;}
  .login-foot{
    margin-top:28px;padding-top:22px;border-top:1px solid var(--line-soft);
    text-align:center;font-size:13px;color:var(--grey);
  }
  .login-foot a{border-bottom:1px solid var(--line-soft);}
  .login-foot a:hover{border-bottom-color:var(--ink);color:var(--ink);}
  .demo-tag{
    display:block;text-align:center;margin-top:20px;
    font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--grey-light);
  }

  footer{border-top:1px solid var(--line);padding:26px 0;background:var(--ink);color:var(--paper);}
  .footer-bottom{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--grey-light);letter-spacing:0.04em;flex-wrap:wrap;gap:10px;
  }
  .footer-bottom .brand{color:var(--paper);font-size:16px;}
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="index.html" class="brand">Guide Seiko Mod</a>
    <a href="index.html" class="back-link">← Retour à la boutique</a>
  </div>
</header>

<main>
  <div class="login-card">
    <div class="login-eyebrow">Espace client</div>
    <h1 id="cardTitle">Connexion</h1>

    <form id="authForm">
      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" name="email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" name="password" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="login-submit" id="submitBtn">Se connecter</button>
      <p class="login-note" id="loginNote"></p>
    </form>

    <div class="login-foot">
      <span id="toggleText">Pas encore de compte ?</span>
      <a href="#" class="mode-toggle" id="modeToggle" style="display:inline;border:none;margin:0;">Créer un compte</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap footer-bottom">
    <span class="brand">Guide Seiko Mod</span>
    <span>© 2026 Guide Seiko Mod. Tous droits réservés.</span>
  </div>
</footer>

<script>
  // config.js must define SUPABASE_URL and SUPABASE_ANON_KEY before this script runs
  const supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  var mode = 'signin'; // or 'signup'
  var form = document.getElementById('authForm');
  var note = document.getElementById('loginNote');
  var submitBtn = document.getElementById('submitBtn');
  var modeToggle = document.getElementById('modeToggle');
  var toggleText = document.getElementById('toggleText');
  var cardTitle = document.getElementById('cardTitle');

  function setNote(msg, type){
    note.textContent = msg;
    note.className = 'login-note' + (type ? ' ' + type : '');
    note.style.display = msg ? 'block' : 'none';
  }

  modeToggle.addEventListener('click', function(e){
    e.preventDefault();
    setNote('');
    if(mode === 'signin'){
      mode = 'signup';
      cardTitle.textContent = 'Créer un compte';
      submitBtn.textContent = 'Créer mon compte';
      toggleText.textContent = 'Déjà un compte ?';
      modeToggle.textContent = 'Se connecter';
    } else {
      mode = 'signin';
      cardTitle.textContent = 'Connexion';
      submitBtn.textContent = 'Se connecter';
      toggleText.textContent = 'Pas encore de compte ?';
      modeToggle.textContent = 'Créer un compte';
    }
  });

  // If already logged in, skip straight to the shop
  supabaseClient.auth.getSession().then(function(res){
    if(res.data.session){ window.location.href = 'index.html'; }
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('l-email').value.trim();
    var password = document.getElementById('l-password').value;

    submitBtn.disabled = true;
    setNote(mode === 'signin' ? 'Connexion en cours…' : 'Création du compte…');

    try{
      if(mode === 'signin'){
        var res = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
        if(res.error) throw res.error;
        window.location.href = 'index.html';
      } else {
        var res2 = await supabaseClient.auth.signUp({ email: email, password: password });
        if(res2.error) throw res2.error;
        if(res2.data.session){
          window.location.href = 'index.html';
        } else {
          setNote('Compte créé. Vérifiez votre email pour confirmer votre adresse avant de vous connecter.', 'success');
        }
      }
    } catch(err){
      setNote(err.message || 'Une erreur est survenue.', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
