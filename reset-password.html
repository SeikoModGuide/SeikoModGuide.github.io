<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Guide Seiko Mod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --ink:#0E0E0F;--paper:#FAF8F4;--paper-dim:#F1EEE7;--line:#D8D4C8;--line-soft:#E7E4DA;
    --grey:#6E6C64;--grey-light:#A8A499;
    --serif:'Cormorant Garamond', Georgia, serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;--mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 40px;}
  header{border-bottom:1px solid var(--line);}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:84px;}
  .brand{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:70px 24px;}
  .card{width:100%;max-width:400px;border:1px solid var(--line);padding:48px 40px;background:var(--paper);}
  .eyebrow{font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--grey);text-align:center;}
  h1{font-family:var(--serif);font-weight:500;font-style:italic;font-size:32px;text-align:center;margin-top:10px;margin-bottom:38px;}
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .field label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey);}
  .field input{font-family:var(--sans);font-size:15px;color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--line);padding:10px 0;outline:none;transition:border-color .3s ease;}
  .field input:focus{border-color:var(--ink);}
  .submit{width:100%;margin-top:10px;padding:16px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;transition:background .3s ease,color .3s ease;}
  .submit:hover{background:transparent;color:var(--ink);}
  .submit[disabled]{opacity:0.5;cursor:not-allowed;}
  .note{display:none;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--grey);text-align:center;}
  .note.error{color:#B23B3B;}
  .note.success{color:#3B7A4A;}
  footer{border-top:1px solid var(--line);padding:26px 0;background:var(--ink);color:var(--paper);}
  .footer-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--grey-light);letter-spacing:0.04em;flex-wrap:wrap;gap:10px;}
  .footer-bottom .brand{color:var(--paper);font-size:16px;}
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="index.html" class="brand">Guide Seiko Mod</a>
  </div>
</header>

<main>
  <div class="card">
    <div class="eyebrow">Espace client</div>
    <h1>Nouveau mot de passe</h1>

    <form id="resetForm">
      <div class="field">
        <label for="new-password">Nouveau mot de passe</label>
        <input type="password" id="new-password" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="submit" id="submitBtn">Valider</button>
      <p class="note" id="note"></p>
    </form>
  </div>
</main>

<footer>
  <div class="wrap footer-bottom">
    <span class="brand">Guide Seiko Mod</span>
    <span>© 2026 Guide Seiko Mod. Tous droits réservés.</span>
  </div>
</footer>

<script>
  var supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  var form = document.getElementById('resetForm');
  var note = document.getElementById('note');
  var submitBtn = document.getElementById('submitBtn');

  function setNote(msg, type){
    note.textContent = msg;
    note.className = 'note' + (type ? ' ' + type : '');
    note.style.display = msg ? 'block' : 'none';
  }

  // Le lien reçu par email contient un token temporaire ;
  // supabase-js le détecte automatiquement dans l'URL et ouvre une session "recovery".
  supabaseClient.auth.onAuthStateChange(function(event){
    if(event === 'PASSWORD_RECOVERY'){
      setNote('');
    }
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var newPassword = document.getElementById('new-password').value;
    submitBtn.disabled = true;
    setNote('Mise à jour…');
    try{
      var res = await supabaseClient.auth.updateUser({ password: newPassword });
      if(res.error) throw res.error;
      setNote('Mot de passe mis à jour. Redirection…', 'success');
      setTimeout(function(){ window.location.href = 'index.html'; }, 1500);
    } catch(err){
      setNote(err.message || 'Lien invalide ou expiré. Redemande un nouveau lien depuis la page de connexion.', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
