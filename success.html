<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Guide Seiko Mod</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0E0E0F;--paper:#FAF8F4;--grey:#6E6C64;--serif:'Cormorant Garamond',serif;--sans:'Jost',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .box{max-width:440px;}
  h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:36px;margin-bottom:18px;}
  p{color:var(--grey);line-height:1.6;margin-bottom:28px;}
  a{color:var(--ink);border-bottom:1px solid var(--ink);text-decoration:none;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;padding-bottom:2px;}
</style>
</head>
<body>
  <div class="box">
    <h1>Merci pour votre commande</h1>
    <p>Votre paiement a bien été reçu. Un email de confirmation Stripe vous a été envoyé. Nous vous recontactons rapidement pour la suite de votre commande.</p>
    <a href="index.html">← Retour à la boutique</a>
  </div>
  <script>
    // Le panier a été mémorisé avant redirection vers Stripe ; on le vide maintenant.
    localStorage.removeItem('lastCart');
  </script>
</body>
</html>
